# Revisión automática del producto en cada cambio.
#
# Seguridad en un repositorio público:
# - Solo tiene permiso de lectura y no usa ningún secreto.
# - Usa `pull_request` y nunca `pull_request_target`: así el código de un cambio
#   ajeno corre sin acceso a nada privado.
# - El checkout no guarda credenciales.
#
# Corre en todo pull request, aunque no toque producto/: si se filtrara por
# carpetas, el día que esta revisión sea obligatoria un cambio solo del sitio web
# quedaría bloqueado esperando una revisión que nunca corre. Tarda poco.
name: Producto · verificar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: producto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: producto
    # La misma base que en desarrollo, solo para esta corrida. Sin contraseña porque
    # vive y muere dentro de la máquina de CI.
    services:
      bd:
        image: public.ecr.aws/docker/library/postgres:17.12
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: coddvisor
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coddvisor"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CODDVISOR_BD_PRUEBAS: postgres://postgres@127.0.0.1:54329/coddvisor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: producto/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm verificar
      # La API arrancada de verdad, como proceso: atrapa lo que las pruebas no ven
      # (un import que solo falla fuera de vitest, una variable que falta). La llave
      # se genera aquí para esta corrida y muere con ella: no es un secreto.
      - name: Arrancar la API de verdad (prueba de humo)
        env:
          CODDVISOR_BD_ADMIN: postgres://postgres@127.0.0.1:54329/coddvisor
        run: |
          export CODDVISOR_LLAVE_CONTEXTO="$(node plataforma/bd/src/llave-nueva.ts)"
          pnpm -s bd:migrar
          PUERTO=8080 node apps/api/src/principal.ts > api.log 2>&1 &
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS localhost:8080/salud
          curl -fsS localhost:8080/listo
          codigo="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"comandos":[{}]}' localhost:8080/v1/comandos)"
          test "$codigo" = 401 || { echo "Sin credencial se esperaba 401 y llegó $codigo"; cat api.log; exit 1; }
