# La ceremonia de la llave del portero: crea una llave en la base real y la
# guarda en los secretos de las funciones de Supabase, sin escribirla nunca en el
# registro de la corrida. También retira una llave vieja.
#
# Solo a mano (pestaña Actions), solo desde main y en el entorno protegido
# «base-real», que exige la aprobación del fundador. Nunca corre sola.
#
# La guía está en sistema/herramientas/migrador/LEEME.md.
name: Llave del portero

on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer'
        type: choice
        options: [crear, retirar]
        default: crear
      # «trabajos» no está en la lista hasta resolver que los secretos de Supabase
      # son de todo el proyecto (LLAVES.trabajos.porque, en configuracion.mjs).
      uso:
        description: 'Para qué programa es la llave (solo al crear)'
        type: choice
        options: [servicio]
        default: servicio
      numero:
        description: 'El número de la llave que se retira (solo al retirar)'
        type: string
        required: false

permissions:
  contents: read

# Una corrida a la vez sobre la base real, compartida con el flujo de las
# migraciones. Con «queue: max» las que llegan esperan en fila (hasta 100) y
# ninguna cancela a otra que espera su aprobación.
concurrency:
  group: base-real
  cancel-in-progress: false
  queue: max

jobs:
  llave:
    name: Llave del portero
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: base-real
    defaults:
      run:
        working-directory: sistema
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: sistema/.nvmrc
      # La CLI de Supabase, en una versión exacta.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.108.0
      - name: Crear o retirar la llave
        env:
          CODDVISOR_MIGRAR_CONEXION: ${{ secrets.CODDVISOR_MIGRAR_CONEXION }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROYECTO_REF: ${{ vars.SUPABASE_PROYECTO_REF }}
          ACCION: ${{ inputs.accion }}
          USO: ${{ inputs.uso }}
          NUMERO: ${{ inputs.numero }}
        run: |
          if [ "$ACCION" = "crear" ]; then
            node herramientas/migrador/ceremonia.mjs crear "$USO"
          else
            node herramientas/migrador/ceremonia.mjs retirar "$NUMERO"
          fi
