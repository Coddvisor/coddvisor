# Despliega la función «servicio» de Supabase (la que atiende /api de
# app.coddvisor.com) en el proyecto de la base real, y carga en sus secretos las
# variables que no son secretas y la llave secreta de Turnstile, que no tiene
# ceremonia propia. Nadie despliega desde su computadora
# (donde-corre-el-sistema.md, decisión 8).
#
# Corre solo al unir a main un cambio de lo que lleva la función (o a mano, desde
# la pestaña Actions), solo desde main y en el entorno protegido «base-real», que
# exige la aprobación del fundador: nada llega a producción sin su visto bueno.
# Va en la misma fila que las migraciones y la llave del portero: una corrida a
# la vez sobre la base real. Un cambio que solo toca guías (.md) no despliega.
#
# Dos pasos:
#   1. «verificar», sin secretos: npm run verificar, y que el candado de Deno
#      (deno.lock) exista y coincida con deno.json.
#   2. «desplegar», en el entorno «base-real»: primero mira que la base real ya
#      tenga todas las migraciones de main (si llegaron junto con este cambio y
#      todavía no se aprobaron, se detiene sin desplegar y dice qué hacer); revisa
#      las variables, mira que los secretos de sus ceremonias ya estén en
#      Supabase, guarda las variables, despliega y comprueba que la función niega
#      lo que no viene del Worker, que corre en la región de la base y que,
#      entrando por app.coddvisor.com como una persona, llega a la base y a
#      Supabase Auth.
#
# Cada paso ve solo lo que usa. El proyecto y la región, que no son secretos, van
# en todo el trabajo. Lo demás del servicio, y la llave secreta de Turnstile, solo
# en los dos pasos que lo revisan y lo guardan: ni las acciones de afuera
# (checkout, setup-node, setup-cli) ni el despliegue con Docker la ven.
#
# La guía para el fundador está en sistema/herramientas/desplegar/LEEME.md.
name: Desplegar el servicio

on:
  # Al unir a main: solo si cambió algo de lo que lleva la función (lo que
  # importa su deno.json), su configuración o su despliegue.
  push:
    branches: [main]
    paths:
      - 'sistema/aplicaciones/servicio/**'
      - 'sistema/supabase/functions/**'
      - 'sistema/supabase/config.toml'
      - 'sistema/nucleo/**'
      - 'sistema/contratos/**'
      - 'sistema/modulos/**'
      - 'sistema/paquetes/**'
      - 'sistema/herramientas/desplegar/**'
      - '.github/workflows/desplegar-servicio.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# La misma fila que migraciones.yml y llave-del-portero.yml. Con «queue: max» las
# que llegan esperan (hasta 100) y ninguna cancela a otra que espera su aprobación.
concurrency:
  group: base-real
  cancel-in-progress: false
  queue: max

jobs:
  verificar:
    name: Verificar y revisar el candado de Deno
    # A mano también se puede elegir otra rama: aquí no pasa.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sistema
    steps:
      # Las acciones van fijadas a una versión exacta por su huella.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: sistema/.nvmrc
          cache: npm
          cache-dependency-path: sistema/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verificar
      # El Deno de la imagen con que la CLI arma la función (edge-runtime v1.74.2 trae Deno 2.1.4).
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.1.4
      - name: El candado de Deno existe y coincide con deno.json
        working-directory: sistema/supabase/functions/servicio
        env:
          # Deno no lee el package.json de sistema/: la función usa solo deno.json.
          DENO_NO_PACKAGE_JSON: '1'
        run: |
          if [ ! -f deno.lock ]; then
            echo "::error::Falta sistema/supabase/functions/servicio/deno.lock. Se genera con el flujo «Candado de Deno» y entra por una solicitud de revisión (herramientas/desplegar/LEEME.md)."
            exit 1
          fi
          deno install --frozen --entrypoint index.ts

  desplegar:
    name: Desplegar la función
    needs: verificar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # El entorno protegido: exige la aprobación del fundador y guarda el token.
    environment: base-real
    defaults:
      run:
        working-directory: sistema
    env:
      SUPABASE_PROYECTO_REF: ${{ vars.SUPABASE_PROYECTO_REF }}
      SUPABASE_REGION: ${{ vars.SUPABASE_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: sistema/.nvmrc
      # Antes de tocar nada: esta corrida tiene que ser de lo último de main. Si
      # main avanzó mientras esperaba (o si alguien la vuelve a correr después),
      # publicaría una versión vieja encima de una nueva. El repositorio es
      # público: se lee sin credenciales.
      - name: Esta corrida es de lo último de main
        run: |
          ultimo="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$ultimo" != "$GITHUB_SHA" ]; then
            echo "::error::Esta corrida es de una versión anterior de main ($GITHUB_SHA); main ya va en $ultimo. No se desplegó nada. Para publicar lo último: Actions → Desplegar el servicio → Run workflow, rama main."
            exit 1
          fi
      # La versión nueva puede necesitar una migración que llegó a main con ella
      # y todavía espera su aprobación. Solo lee la base.
      - name: La base real tiene todas las migraciones de main
        env:
          CODDVISOR_MIGRAR_CONEXION: ${{ secrets.CODDVISOR_MIGRAR_CONEXION }}
        run: node herramientas/migrador/migrar.mjs --exigir-al-dia
      # La CLI de Supabase, en la misma versión exacta que la ceremonia de la llave.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.108.0
      # Si falta una variable, la corrida termina aquí.
      - name: Revisar las variables del entorno
        env:
          CODDVISOR_ORIGEN: ${{ vars.CODDVISOR_ORIGEN }}
          CODDVISOR_PASE_EMISOR: ${{ vars.CODDVISOR_PASE_EMISOR }}
          CODDVISOR_PASE_AUDIENCIA: ${{ vars.CODDVISOR_PASE_AUDIENCIA }}
          CODDVISOR_PASE_LLAVES: ${{ vars.CODDVISOR_PASE_LLAVES }}
          CODDVISOR_CUENTAS_DIRECCION: ${{ vars.CODDVISOR_CUENTAS_DIRECCION }}
          CODDVISOR_CUENTAS_CLAVE_PUBLICA: ${{ vars.CODDVISOR_CUENTAS_CLAVE_PUBLICA }}
          # Turnstile (sistema/supabase/turnstile.md, paso 3): la llave del sitio es
          # pública; la secreta va en los secretos del entorno, y GitHub la tapa en el registro.
          CODDVISOR_CAPTCHA_LLAVE_DEL_SITIO: ${{ vars.CODDVISOR_CAPTCHA_LLAVE_DEL_SITIO }}
          CODDVISOR_CAPTCHA_SECRETO: ${{ secrets.CODDVISOR_CAPTCHA_SECRETO }}
        run: node herramientas/desplegar/desplegar.mjs revisar
      - name: Revisar que los secretos de las ceremonias ya estén en Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node herramientas/desplegar/desplegar.mjs secretos
      - name: Guardar las variables y la llave de Turnstile en los secretos de la función
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CODDVISOR_ORIGEN: ${{ vars.CODDVISOR_ORIGEN }}
          CODDVISOR_PASE_EMISOR: ${{ vars.CODDVISOR_PASE_EMISOR }}
          CODDVISOR_PASE_AUDIENCIA: ${{ vars.CODDVISOR_PASE_AUDIENCIA }}
          CODDVISOR_PASE_LLAVES: ${{ vars.CODDVISOR_PASE_LLAVES }}
          CODDVISOR_CUENTAS_DIRECCION: ${{ vars.CODDVISOR_CUENTAS_DIRECCION }}
          CODDVISOR_CUENTAS_CLAVE_PUBLICA: ${{ vars.CODDVISOR_CUENTAS_CLAVE_PUBLICA }}
          # Turnstile (sistema/supabase/turnstile.md, paso 3): la llave del sitio es
          # pública; la secreta va en los secretos del entorno, y GitHub la tapa en el registro.
          CODDVISOR_CAPTCHA_LLAVE_DEL_SITIO: ${{ vars.CODDVISOR_CAPTCHA_LLAVE_DEL_SITIO }}
          CODDVISOR_CAPTCHA_SECRETO: ${{ secrets.CODDVISOR_CAPTCHA_SECRETO }}
        run: node herramientas/desplegar/desplegar.mjs guardar
      # Sin revisión del pase de Supabase en el encabezado, como pide config.toml:
      # las rutas revisan la cookie. La CLI arma la función con Docker, que trae el runner.
      - name: Desplegar la función servicio
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy servicio --project-ref "$SUPABASE_PROYECTO_REF" --no-verify-jwt --use-docker --yes
      # Sin token: llama como cualquiera desde afuera, directo y por app.coddvisor.com.
      - name: Comprobar la puerta, la región, la base y Supabase Auth
        env:
          CODDVISOR_ORIGEN: ${{ vars.CODDVISOR_ORIGEN }}
        run: node herramientas/desplegar/desplegar.mjs comprobar
