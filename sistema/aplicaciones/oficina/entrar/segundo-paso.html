<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title data-texto="segundo.titulo-de-la-pagina"></title>
  <link rel="icon" href="/marca/logo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/marca/colores.css">
  <link rel="stylesheet" href="/diseno/medidas.css">
  <link rel="stylesheet" href="/comun/oficina.css">
  <script type="module" src="/entrar/segundo-paso.js"></script>
</head>
<body class="cargando">
  <main class="marco">
    <header class="cabecera">
      <picture>
        <source srcset="/marca/logo/coddvisor-logotipo-horizontal-fondo-oscuro.svg" media="(prefers-color-scheme: dark)">
        <img class="logo" src="/marca/logo/coddvisor-logotipo-horizontal.svg" width="160" height="24" data-texto-alt="marca.nombre">
      </picture>
    </header>

    <h1 data-texto="segundo.titulo"></h1>
    <p class="ayuda" data-texto="segundo.bajada"></p>

    <p class="aviso aviso-error" id="aviso" role="alert" hidden>
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
      <span id="aviso-texto"></span>
    </p>

    <form id="formulario" novalidate>
      <div class="campo campo-codigo">
        <label for="codigo" data-texto="segundo.codigo"></label>
        <input id="codigo" name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" required>
      </div>
      <button class="boton boton-principal boton-ancho" id="confirmar" type="submit" data-texto="segundo.boton"></button>
    </form>

    <p><a class="enlace" href="/entrar/pronto?tema=respaldo&amp;desde=segundo-paso" data-texto="segundo.respaldo"></a></p>
    <p><button class="enlace boton-como-enlace" id="otra-cuenta" type="button" data-texto="segundo.otra-cuenta"></button></p>
  </main>
</body>
</html>
