<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title data-texto="negocios.titulo-de-la-pagina"></title>
  <link rel="icon" href="/marca/logo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/marca/colores.css">
  <link rel="stylesheet" href="/diseno/medidas.css">
  <link rel="stylesheet" href="/comun/oficina.css">
  <script type="module" src="/entrar/negocios.js"></script>
</head>
<body class="cargando">
  <main class="marco">
    <header class="cabecera">
      <picture>
        <source srcset="/marca/logo/coddvisor-logotipo-horizontal-fondo-oscuro.svg" media="(prefers-color-scheme: dark)">
        <img class="logo" src="/marca/logo/coddvisor-logotipo-horizontal.svg" width="160" height="24" data-texto-alt="marca.nombre">
      </picture>
      <button class="enlace boton-como-enlace" id="salir" type="button" data-texto="comun.salir"></button>
    </header>

    <h1 data-texto="negocios.titulo"></h1>
    <p class="ayuda" data-texto="negocios.bajada"></p>

    <p class="aviso aviso-error" id="aviso" role="alert" hidden>
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
      <span id="aviso-texto"></span>
    </p>

    <ul class="negocios" id="negocios" data-texto-aria="negocios.lista"></ul>

    <button class="boton boton-secundario boton-ancho" id="mas" type="button" data-texto="negocios.mas" hidden></button>

    <section class="tarjeta" id="vacio" hidden>
      <h2 data-texto="negocios.vacio.titulo"></h2>
      <p data-texto="negocios.vacio.texto"></p>
      <p><a class="boton boton-principal boton-ancho" href="/entrar/pronto?tema=abrir&amp;desde=negocios" data-texto="negocios.vacio.boton"></a></p>
    </section>

    <template id="plantilla-negocio">
      <li>
        <a class="negocio" href="/inicio/">
          <span class="negocio-texto">
            <span class="negocio-nombre"></span>
            <span class="negocio-rol" hidden></span>
            <span class="estado" hidden>
              <svg class="icono" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              <span class="estado-texto"></span>
            </span>
          </span>
          <svg class="icono flecha" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </li>
    </template>
  </main>
</body>
</html>
